# --- OSGi bundles built with Tycho (check set tech/osgi-tycho 0.1, static half) --------------------
# The static checks read the bundle contract from the files themselves (MANIFEST.MF, OSGI-INF/*.xml,
# build.properties, feature.xml, plugin.xml, .target). They read two lists from this declaration.
# Both stay commented out until the owner decides them; with them absent the checks behave as with
# empty lists.
#
# Packages exported by more than one bundle that this project intends. A change that adds a new split
# goes to a person; a split listed here is exempt. Counted at upstream commit bd4f848 (8 packages); they
# work at runtime through Require-Bundle and fragments. TODO(owner): confirm each is intended, recount at
# the fork's pin, then uncomment.
# split-packages:
#   - org.compiere.model          # org.adempiere.base, org.adempiere.base.callout
#   - org.adempiere.process       # org.adempiere.base, org.adempiere.base.process
#   - org.compiere.process        # org.adempiere.base, org.adempiere.base.process
#   - org.idempiere.process       # org.adempiere.base, org.adempiere.base.process
#   - org.compiere.dbPort         # org.adempiere.base, org.compiere.db.postgresql.provider
#   - org.compiere.install        # org.adempiere.base, org.adempiere.install, org.adempiere.ui
